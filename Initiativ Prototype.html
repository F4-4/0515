<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order book prototype</title>
<script>
// set theme before first paint: saved choice, else the OS preference
(function () { var t = null; try { t = localStorage.getItem('theme'); } catch (e) {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --hover:#383838; --page:#2a2a2a; --panel:#1e1e1e; --line:#3a3a3a; --chip:#383838;
  --text:#f2f2f2; --muted:#8a8a8a;
  --ask:#f2776a; --ask-bar:#5c3935; --bid:#7fd9a3; --bid-bar:#1e4033;
  --strong:#fff; --grip:#777; --scrollbar:#444; --shadow:rgba(0,0,0,.4);
  --row:30px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --hover:#ebebeb; --page:#eceeef; --panel:#fff; --line:#e0e0e0; --chip:#f0f0f0;
  --text:#1b1b1b; --muted:#6f6f6f;
  --ask:#c93c2e; --ask-bar:#f7d9d5; --bid:#17834a; --bid-bar:#cfeadb;
  --strong:#111; --grip:#aaa; --scrollbar:#c6c6c6; --shadow:rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html,body{min-height:100%}
body{background:var(--page);color:var(--text);font:400 14px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;padding:0 0 24px}
.wrap{position:relative;flex:none;width:360px;max-width:calc(100% - 32px);min-width:300px;min-height:360px;height:min(960px,calc(100vh - 130px))}
.panel{container-type:inline-size;height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>*{flex-shrink:0}
.top{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px}
.tab{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:6px;padding:0 6px 0 10px;height:28px;font-weight:500;font-size:13px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--chip);color:var(--text)}
.tab:hover:not(.on){color:var(--text)}
.tab .x{background:none;border:0;color:inherit;display:flex;padding:2px;border-radius:4px;cursor:pointer}
.tab .x:hover{background:var(--hover)}.tab .x .ico{width:13px;height:13px}
.wtabs{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top .ico{cursor:pointer}
.sp{flex:1}
.ctl{display:flex;gap:8px;margin:0 8px 8px}
.sel{display:block;position:relative;flex:1;min-width:0}
.sel select{display:block;appearance:none;-webkit-appearance:none;width:100%;height:28px;background:var(--chip);color:var(--text);border:0;border-radius:6px;
  padding:0 30px 0 10px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
.sel select:focus-visible{outline:2px solid #8ab4ff}
.sel .ico{position:absolute;right:8px;top:5px;pointer-events:none}
.panel>.wv{flex:1;min-height:0;display:flex;flex-direction:column}
.wv>*{flex-shrink:0}
.wv>.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}
#midrow{cursor:pointer}
.grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;align-items:center;padding:0 16px}
.head{height:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.head span:nth-child(n+2),.row span:nth-child(n+2){text-align:right}
.row{position:relative;height:var(--row);cursor:default;border-top:1px dashed transparent;border-bottom:1px dashed transparent}
.row>span{position:relative;z-index:1}
.row .p{display:flex;align-items:center;gap:14px}
.row .p .ico{width:15px;height:15px}
.row.ask .p{color:var(--ask)} .row.bid .p{color:var(--bid)}
.bar{position:absolute;right:0;top:0;bottom:0;z-index:0;transition:width .35s ease}
.ask .bar{background:var(--ask-bar)} .bid .bar{background:var(--bid-bar)}
.row.in{background:var(--hover)}
.row.ask.edge{border-top-color:var(--strong)} .row.bid.edge{border-bottom-color:var(--strong)}
.mid{height:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--text);font-size:14px}
.mid .l{display:flex;align-items:center;gap:16px}
.mid .l .ico{width:15px;height:15px}
.mid .r{color:var(--muted);grid-column:2/4;text-align:right}
.mid .up{color:var(--bid)} .mid .dn{color:var(--ask)}
.tip{position:fixed;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:5px 12px;display:none;pointer-events:none;z-index:5;box-shadow:0 4px 16px var(--shadow)}
.tip.show{display:block}
.tip div{display:flex;justify-content:space-between;height:22px;align-items:center;gap:12px;font-size:13px;white-space:nowrap}
.hd{position:absolute;z-index:6;touch-action:none;border-radius:6px}
.hd:hover,.hd.on{background:rgba(120,160,255,.45)}
.hd.e{top:14px;bottom:14px;right:-5px;width:10px;cursor:ew-resize}
.hd.s{left:14px;right:14px;bottom:-5px;height:10px;cursor:ns-resize}
.hd.c{right:-6px;bottom:-6px;width:22px;height:22px;cursor:nwse-resize}
.hd.c::after{content:"";position:absolute;right:9px;bottom:9px;width:8px;height:8px;border-right:2px solid var(--grip);border-bottom:2px solid var(--grip)}
#expand{cursor:pointer}
@container (max-width:420px){
  .head,.mid,.tab,.sel select{font-size:13px}
  .row{font-size:13px;height:28px}.grid{padding:0 12px}.row .p{gap:8px}
}
@container (max-width:360px){
  .head,.mid,.tab,.sel select{font-size:12px}
  .row{font-size:12px;height:26px}.row .p .ico{width:14px;height:14px}.tab{padding:0 10px}.top{gap:10px}
}
@media (max-width:520px){body{padding:16px 8px}}
[hidden]{display:none!important}
.topbar{align-self:stretch;flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);margin-bottom:24px}
.sw{position:relative;width:54px;height:30px;border-radius:15px;border:0;background:var(--chip);cursor:pointer;padding:0 8px;
  display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.sw .ico{width:14px;height:14px;position:relative;z-index:1}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);transition:transform .2s}
.sw[aria-checked="true"] i{transform:translateX(24px)}
.sw[aria-checked="false"] .moon,.sw[aria-checked="true"] .sun{color:var(--text)}
.sw:focus-visible{outline:2px solid #8ab4ff}
.views{display:inline-flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.views button{font:500 13px Inter,system-ui,sans-serif;color:var(--muted);background:none;border:0;border-radius:7px;padding:8px 14px;cursor:pointer}
.views button.on{background:var(--panel);color:var(--text)}
.mutm{color:var(--muted);font-weight:400}
.mkt{flex:none;width:calc(100% - 32px);max-width:720px;font-size:13px;container-type:inline-size;height:min(540px,calc(100vh - 130px));min-height:320px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mkt>*{flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;margin:8px;height:28px;padding:0 10px;background:var(--chip);border-radius:6px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:400 13px Inter,system-ui,sans-serif}
.search .ico{width:15px;height:15px}
.search:focus-within{outline:2px solid #8ab4ff}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:500 13px Inter,system-ui,sans-serif;padding:7px 10px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--strong);border-color:var(--strong)}
.mk{display:grid;grid-template-columns:minmax(0,2.6fr) repeat(6,minmax(0,1fr));column-gap:8px;align-items:center;padding:0 12px}
.mh{height:28px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.sh{background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px}
.sh.on{color:var(--strong);font-weight:600}.sh .ico{width:14px;height:14px;display:none}.sh.on .ico{display:block}.sh.asc .ico{transform:rotate(180deg)}
.mkt>.ml{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.mr{height:28px;cursor:pointer}.mr.act{background:var(--hover)}
.mc{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.star{background:none;border:0;color:var(--strong);padding:0;display:flex;cursor:pointer}
.star.f{color:#e8b84a}.star.f svg{fill:currentColor}
.logo{font-weight:800;font-size:14px}
.star .ico{width:15px;height:15px}
.pos{color:var(--bid)}.neg{color:var(--ask)}.mut{color:var(--muted)}
.mf{display:flex;gap:18px;padding:7px 12px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.mf kbd{font:500 11px Inter,system-ui,sans-serif;background:var(--chip);color:var(--muted);border-radius:5px;padding:3px 6px;margin-right:6px}
@container (max-width:600px){
  .mk{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))}
  .mk>:nth-child(2),.mk>:nth-child(6),.mk>:nth-child(7){display:none}
}
.ib{background:none;border:0;color:inherit;display:flex;padding:0;cursor:pointer;border-radius:4px}
.ib:focus-visible{outline:2px solid #8ab4ff}
.pop{position:fixed;z-index:20;width:340px;max-width:calc(100vw - 16px);max-height:calc(100vh - 90px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;box-shadow:0 12px 32px var(--shadow)}
.pop h2{font:500 16px Inter,system-ui,sans-serif;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wt{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.wt .tile{aspect-ratio:1.4;background:var(--chip);border-radius:10px;margin-bottom:8px}
.wt:hover .tile,.wt:focus-visible .tile{outline:2px solid var(--muted)}
.wt span{font-size:13px;opacity:.7}
.psec{font-size:12px;color:var(--muted);margin:0 0 8px}
.pgrid+.psec,.pempty+.psec{margin-top:16px}
.pempty{font-size:13px;color:var(--muted);padding:2px 0 4px}
.tile svg{display:block;width:100%;height:100%}
.tr>span{position:relative;z-index:1}
.tb{position:absolute;left:0;top:0;bottom:0;z-index:0;transition:width .3s ease}
.tb.b{background:var(--bid-bar)}.tb.s{background:var(--ask-bar)}
.tr{position:relative;border-top:1px solid transparent;border-bottom:1px solid transparent;display:grid;grid-template-columns:1.25fr 1fr 1fr;align-items:center;padding:0 16px;height:var(--row)}
.tr span:nth-child(n+2){text-align:right}.tr .b{color:var(--bid)}.tr .s{color:var(--ask)}
.wempty{align-items:center;justify-content:center;color:var(--muted);font-size:13px}
/* live flash, keyboard focus, drag */
@keyframes fl{from{opacity:1}to{opacity:0}}
.fl-u::after,.fl-d::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:var(--fl);animation:fl .7s ease-out both;animation-delay:var(--d,0ms)}
.fl-u{--fl:color-mix(in srgb,var(--bid) 38%,transparent)}.fl-d{--fl:color-mix(in srgb,var(--ask) 38%,transparent)}
@media (prefers-reduced-motion:reduce){.fl-u::after,.fl-d::after{display:none}}
.scroll:focus-visible{outline:2px solid #8ab4ff;outline-offset:-2px}
.tr:hover,.tr.act{background:var(--hover)}
.tab[draggable="true"]{cursor:grab}.tab.dragging{opacity:.4}
.cx{position:relative;background:none;border:0;padding:0;color:inherit;display:flex;cursor:pointer;opacity:.9}
.cx:hover{opacity:1}
.cx::after{content:attr(data-tip);position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--strong);color:var(--panel);font-size:11px;font-weight:500;padding:3px 7px;border-radius:4px;white-space:nowrap;display:none;pointer-events:none;z-index:5}
.cx:hover::after{display:block}
/* hide scrollbars everywhere, scrolling still works */
*{scrollbar-width:none!important}
*::-webkit-scrollbar{display:none!important;width:0;height:0}
.sk{display:inline-block;height:14px;border-radius:3px;background:var(--chip);opacity:.8;vertical-align:middle;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sr{height:28px}
.tools{display:flex;align-items:center;gap:18px}
.ls{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer}
.tg{position:relative;width:38px;height:22px;border-radius:11px;border:0;background:var(--chip);cursor:pointer;padding:0}
.tg i{position:absolute;top:4px;left:4px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg[aria-checked="true"]{background:var(--strong)}
.tg[aria-checked="true"] i{background:var(--panel);transform:translateX(16px)}
.tg:focus-visible{outline:2px solid #8ab4ff}
</style>
</head>
<body>
<header class="topbar"><div class="views">
  <button data-v="ob" class="on">Order book</button><button data-v="mk">Market selector</button>
</div>
<div class="tools"><label class="ls">Loading state<button class="tg" id="loadsw" role="switch" aria-checked="false" aria-label="Show loading state"><i></i></button></label>
<button class="sw" id="theme" role="switch" aria-checked="false" aria-label="Light mode"><i></i>
  <svg class="ico moon" viewBox="0 0 20 20"><path d="M16.500 11.500A6.500 6.500 0 018.500 3.500a6.500 6.500 0 107.999 8z"/></svg>
  <svg class="ico sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.500"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.300 4.300l1.400 1.400M14.300 14.300l1.400 1.400M4.300 15.700l1.400-1.400M14.300 5.700l1.400-1.400"/></svg>
</button></div></header>
<div class="wrap" id="wrap">
  <div class="hd e" data-d="e"></div><div class="hd s" data-d="s"></div><div class="hd c" data-d="c"></div>
  <div class="panel">
    <div class="top">
      <div class="wtabs" id="wtabs" role="tablist"></div>
      <button class="ib" id="addw" aria-label="Add widget" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M10 6.5v7M6.5 10h7"/></svg></button>
      <span class="sp"></span>
      <svg class="ico" id="expand" viewBox="0 0 20 20"><path d="M12 3h5v5M8 17H3v-5M17 3l-5.5 5.5M3 17l5.5-5.5"/></svg>
    </div>
    <div class="wv" id="v-ob">
    <div class="ctl">
      <label class="sel">
        <select id="tick" aria-label="Price grouping">
          <option>0.01</option><option>0.05</option><option>0.10</option><option>0.50</option><option>1.00</option>
        </select>
        <svg class="ico" viewBox="0 0 20 20"><path d="M4 7.5l6 6 6-6"/></svg>
      </label>
      <label class="sel u">
        <select id="unit" aria-label="Show amounts in">
          <option value="tons">Tons</option><option value="eur">EUR</option>

    </div>
    <div class="grid head"><span id="hP">Price (EUR)</span><span id="hA">Amount (tons)</span><span id="hT">Total (tons)</span></div>

      <span class="l"><span id="midp">–</span></span>

  </div>
</div>

<div class="mkt" id="mkt" hidden>
  <label class="search"><svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13.200 13.200L17 17"/></svg>
    <input id="q" placeholder="Search" autocomplete="off" aria-label="Search markets"></label>

  <div class="mk mh">
    <span>Market</span><span>Expiry</span>

    <span>OI (tonnes)</span><span>Funding/hr</span>

  <div class="mf"><span><kbd>⌘K</kbd>Open</span><span><kbd>Enter</kbd>Select</span><span><kbd>⌘S</kbd>Favourite</span><span><kbd>ESC</kbd>Close</span></div>
</div>

<script>
// ---------- fake market (prices stored in cents) ----------
const N = 40;
const asks = new Map(), bids = new Map();
const rnd = (a, b) => a + Math.random() * (b - a);
const amt = () => Math.round(5 + Math.pow(Math.random(), 2.6) * 900);
const mkLevel = () => ({ a: amt() });
let myOrder = null; // the one resting order that belongs to the user: { side, p (cents), q (tons) }
const sorted = (m, dir) => [...m.keys()].sort((x, y) => dir * (x - y));
let mid = 8995, lastMid = mid, dir = -1;

function placeMine() {
  const side = Math.random() < .5 ? 'ask' : 'bid', m = side === 'ask' ? asks : bids;
  const p = sorted(m, side === 'ask' ? 1 : -1)[4 + Math.floor(Math.random() * 5)], q = 80 + Math.floor(Math.random() * 220);
  m.get(p).a += q; myOrder = { side, p, q };
}
function ensureMine() { // keep the user's order alive inside the simulated book
  if (!myOrder) return;
  const m = myOrder.side === 'ask' ? asks : bids, l = m.get(myOrder.p);
  if (l) { if (l.a < myOrder.q) l.a = myOrder.q; return; }
  const b = best();
  if ((myOrder.side === 'ask' && myOrder.p > b.bid) || (myOrder.side === 'bid' && myOrder.p < b.ask)) m.set(myOrder.p, { a: myOrder.q }); else myOrder = null;
}
function cancelOrder() {
  if (!myOrder) return;
  const m = myOrder.side === 'ask' ? asks : bids, l = m.get(myOrder.p);
  if (l) { l.a -= myOrder.q; if (l.a <= 0) m.delete(myOrder.p); }
  myOrder = null; ver++; hover = null; render();
}
function seed() {
  let p = mid + 8; for (let i = 0; i < 1400; i++) { asks.set(p, mkLevel()); p += Math.random() < .2 ? 2 : 1; }
  p = mid - 8;     for (let i = 0; i < 1400 && p > 5; i++) { bids.set(p, mkLevel()); p -= Math.random() < .2 ? 2 : 1; }
}
seed(); placeMine();
let tid = 0, trSel = null;
const trades = [];
function seedTrades() {
  trades.length = 0;
  for (let i = 0; i < 30; i++) trades.push({ id: ++tid, p: Math.round(mid + (Math.random() - .5) * 24), a: amt(), buy: Math.random() < .5, t: new Date(Date.now() - i * 17000) });
}
seedTrades();
function rebase(c) { asks.clear(); bids.clear(); mid = lastMid = c; seed(); placeMine(); seedTrades(); snap = null; flashes.clear(); }

const best = () => ({ ask: Math.min(...asks.keys()), bid: Math.max(...bids.keys()) });
const pick = (m, topN) => { const k = sorted(m, m === asks ? 1 : -1).slice(0, topN); return k[Math.floor(Math.random() * k.length)]; };

function step() {
  ver++;
  for (let i = 0; i < 5; i++) {

let tab = 'All', q = '', sort = { k: 'vol', d: -1 }, act = null, vis = [];
const STAR = '<svg class="ico" viewBox="0 0 20 20"><path d="M10 2.500l2.300 4.800 5.200.7-3.800 3.700.9 5.200L10 14.400l-4.600 2.500.9-5.200L2.500 8l5.200-.7z"/></svg>';
const sortVal = { last: m => m.l ?? -1, chg: m => m.ch, vol: m => m.vn };

function renderM() {
  const ml = $('ml'), st = ml.scrollTop;
  let rows = MK.filter(m => (tab === 'All' || (tab === 'Watchlist' ? favs.has(m.n) : m.c === tab)) && m.n.toLowerCase().includes(q.toLowerCase()));
  const f = sortVal[sort.k]; rows.sort((a, b) => sort.d * (f(a) - f(b)));
  vis = loading ? [] : rows.map(m => m.n);
  if (!vis.includes(act)) act = null;
  $('tabs').innerHTML = TABS.map(t => `<button data-t="${t}" class="${t === tab ? 'on' : ''}">${t}</button>`).join('');
  document.querySelectorAll('.sh').forEach(b => { b.classList.toggle('on', b.dataset.k === sort.k); b.classList.toggle('asc', b.dataset.k === sort.k && sort.d > 0); });
  ml.innerHTML = loading ? skRows() : rows.map(m => `<div class="mk mr${m.n === act ? ' act' : ''}" data-n="${m.n}">
    <span class="mc"><button class="star${favs.has(m.n) ? ' f' : ''}" data-star aria-label="Toggle favourite">${STAR}</button><b class="logo">C</b>${m.n}</span>
    <span>${m.e}</span><span>${m.l == null ? '-' : m.l.toFixed(3)}</span>
    <span class="${m.ch > 0 ? 'pos' : 'neg'}">${m.ch > 0 ? '+' : ''}${m.ch.toFixed(3)}%</span><span>${SYM[m.ccy]}${fmtK(m.v)}</span><span>${m.oi == null ? '-' : fmtK(m.oi)}</span><span class="mut">-</span></div>`).join('')
    || '<div class="mut" style="padding:24px 16px">No markets found</div>';
  ml.scrollTop = st;
}
function skRows() {
  const n = Math.max(8, Math.ceil($('ml').clientHeight / 28) + 1), dot = '<i class="sk" style="width:14px;height:14px;border-radius:50%"></i>';
  return `<div class="mk sr"><span class="mc">${dot}${dot}${SK(110)}</span>${`<span>${SK(52)}</span>`.repeat(6)}</div>`.repeat(n);
}
function setAct(n) { act = n; document.querySelectorAll('.mr').forEach(r => r.classList.toggle('act', r.dataset.n === n)); }
function toggleFav(n) { if (!n) return; favs.has(n) ? favs.delete(n) : favs.add(n); renderM(); }
function choose(n) {
  const m = MK.find(x => x.n === n); curMarket = n; curCcy = m.ccy; applyCcy(); if (OPEN.includes('ob')) active = 'ob';
  if (m.l) rebase(Math.round(m.l * 100));
  hover = null; show('ob');
}
function show(v) {
  $('wrap').hidden = v !== 'ob'; $('mkt').hidden = v !== 'mk';
  document.querySelectorAll('.views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('tip').classList.remove('show'); closePop();
  if (v === 'ob') showTab(); else { act = null; tab = 'All'; renderM(); $('q').focus(); }
}
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
$('q').addEventListener('input', e => { q = e.target.value; renderM(); });
$('tabs').addEventListener('click', e => { const t = e.target.dataset.t; if (t) { tab = t; renderM(); } });
document.querySelector('.mh').addEventListener('click', e => {
  const k = e.target.closest('.sh')?.dataset.k; if (!k) return;
  sort = { k, d: sort.k === k ? -sort.d : -1 }; renderM();
});
$('ml').addEventListener('mouseleave', () => setAct(null));
$('ml').addEventListener('mouseover', e => { const r = e.target.closest('.mr'); if (r && r.dataset.n !== act) setAct(r.dataset.n); });
$('ml').addEventListener('click', e => {
  const r = e.target.closest('.mr'); if (!r) return;
  e.target.closest('[data-star]') ? toggleFav(r.dataset.n) : choose(r.dataset.n);
});
addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'k') { e.preventDefault(); show('mk'); return; }
  if ($('mkt').hidden) return;
  if (k === 'escape') show('ob');
  else if (k === 'enter') { if (act) choose(act); }
  else if (mod && k === 's') { e.preventDefault(); toggleFav(act); }
  else if (k === 'arrowdown' || k === 'arrowup') {
    e.preventDefault(); const i = act ? vis.indexOf(act) + (k === 'arrowdown' ? 1 : -1) : (k === 'arrowdown' ? 0 : vis.length - 1);
    if (vis[i]) { setAct(vis[i]); document.querySelector('.mr.act')?.scrollIntoView({ block: 'nearest' }); }
  }
});
// live prices
setInterval(() => {
  for (let i = 0; i < 3; i++) {
    const m = MK[Math.floor(Math.random() * MK.length)]; if (m.l == null) continue;
    const d = (Math.random() < .5 ? -1 : 1) * (0.01 + Math.random() * 0.04) * (m.l > 20 ? 1 : .1);
    m.ch += d / m.l * 100; m.l = Math.max(.01, m.l + d);
  }
  if (!$('mkt').hidden && !loading) renderM();
}, 1400);
</script>
</body>
</html>
